spring:
  datasource:
    url: jdbc:h2:mem:vinylstore;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  jwt:
    secret-base64: dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQ=
    issuer: vinyl-store-test
    access-minutes: 10
    refresh-days: 1
  bootstrap:
    email:
    password:
management:
  health:
    mail:
      enabled: false
logging:
  level:
    root: WARN
    org.springframework: WARN
